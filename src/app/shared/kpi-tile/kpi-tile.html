<div
  class="relative overflow-hidden rounded-xl bg-white dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700/60 p-4 shadow-sm hover:shadow-md transition"
>
  <div class="flex items-start justify-between gap-2">
    <div class="min-w-0">
      <div
        class="text-[11px] uppercase tracking-widest font-semibold text-slate-400 dark:text-slate-500 mb-1"
      >
        {{ label }}
      </div>
      <div class="flex items-baseline gap-1.5">
        <span class="text-2xl md:text-3xl font-black text-slate-800 dark:text-slate-100">{{
          value
        }}</span>
        @if (unit) {
          <span class="text-sm font-semibold text-slate-400 dark:text-slate-500">{{ unit }}</span>
        }
      </div>
      @if (trend != null) {
        <div class="mt-2 inline-flex items-center gap-1 text-xs font-semibold" [class]="trendClass">
          <i [class]="trendIcon + ' text-[10px]'"></i>
          <span>{{ trend > 0 ? '+' : '' }}{{ trend }}%</span>
          <span class="text-slate-400 dark:text-slate-500 font-normal">vs. gestern</span>
        </div>
      }
    </div>
    <div class="w-10 h-10 rounded-lg flex items-center justify-center shrink-0" [class]="iconWrap">
      <i [class]="icon + ' text-lg'"></i>
    </div>
  </div>
</div>
