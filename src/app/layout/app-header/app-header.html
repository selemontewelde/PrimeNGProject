<header
  class="sticky top-0 z-50 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shadow-sm"
>
  <div class="max-w-screen-2xl mx-auto flex items-center gap-3 px-4 md:px-6 h-14">
    <!-- Hamburger (Mobile) -->
    <button
      type="button"
      class="lg:hidden inline-flex items-center justify-center w-10 h-10 rounded-md text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition"
      (click)="layout.toggleDrawer()"
      aria-label="Navigation öffnen"
    >
      <i class="pi pi-bars text-lg"></i>
    </button>

    <!-- Logo / Brand -->
    <div class="flex items-center gap-2">
      <div
        class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-sm"
      >
        <i class="pi pi-bolt text-white text-sm"></i>
      </div>
      <div class="leading-tight">
        <div class="font-bold text-slate-800 dark:text-slate-100 text-sm">NetOps</div>
        <div class="text-[10px] uppercase tracking-widest text-slate-400 dark:text-slate-500">
          Monitoring
        </div>
      </div>
    </div>

    <!-- Anchor Nav (Desktop) -->
    <nav class="hidden md:flex items-center gap-1 ml-6">
      @for (item of items; track item.id) {
        <button
          type="button"
          class="inline-flex items-center gap-2 px-3 py-1.5 rounded-md text-sm font-medium transition border border-transparent"
          [class.text-slate-600]="layout.activeSection() !== item.id"
          [class.dark:text-slate-300]="layout.activeSection() !== item.id"
          [class.hover:bg-slate-100]="layout.activeSection() !== item.id"
          [class.dark:hover:bg-slate-800]="layout.activeSection() !== item.id"
          [class.bg-indigo-50]="layout.activeSection() === item.id"
          [class.dark:bg-indigo-500/10]="layout.activeSection() === item.id"
          [class.text-indigo-600]="layout.activeSection() === item.id"
          [class.dark:text-indigo-300]="layout.activeSection() === item.id"
          [class.border-indigo-200]="layout.activeSection() === item.id"
          [class.dark:border-indigo-500/30]="layout.activeSection() === item.id"
          (click)="go(item.id)"
        >
          <i [class]="item.icon + ' text-xs'"></i>
          <span>{{ item.label }}</span>
        </button>
      }
    </nav>

    <!-- Right Side: Theme Toggle -->
    <div class="ml-auto flex items-center gap-2">
      <span
        class="hidden sm:inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-300 text-xs font-semibold border border-emerald-200 dark:border-emerald-500/20"
      >
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
        Live
      </span>
      <p-button
        [icon]="themeIcon()"
        [rounded]="true"
        [text]="true"
        severity="secondary"
        size="small"
        (onClick)="theme.toggle()"
        pTooltip="Theme wechseln"
        tooltipPosition="bottom"
      />
    </div>
  </div>
</header>
