<p-drawer
  [(visible)]="visible"
  position="left"
  styleClass="!w-[85vw] sm:!w-96"
  header="Infrastruktur"
  [showCloseIcon]="true"
  [modal]="true"
  [dismissible]="true"
>
  <div class="flex flex-col gap-3">
    <div class="flex items-center gap-2">
      <p-iconfield iconPosition="left" class="flex-grow">
        <p-inputicon class="pi pi-search" />
        <input
          #search
          type="text"
          pInputText
          placeholder="Geräte suchen…"
          class="w-full"
          (input)="filterTree(search.value)"
        />
      </p-iconfield>
      <p-button
        icon="pi pi-angle-double-down"
        size="small"
        [text]="true"
        severity="secondary"
        (onClick)="expandAll()"
        pTooltip="Alle aufklappen"
        tooltipPosition="bottom"
      />
      <p-button
        icon="pi pi-angle-double-up"
        size="small"
        [text]="true"
        severity="secondary"
        (onClick)="collapseAll()"
        pTooltip="Alle zuklappen"
        tooltipPosition="bottom"
      />
    </div>

    <p-tree
      #tree
      [value]="data.nodes()"
      selectionMode="single"
      [(selection)]="selectedNode"
      (onNodeSelect)="onSelect($event)"
      [draggableNodes]="false"
      [droppableNodes]="false"
      class="w-full"
    >
      <ng-template let-node pTemplate="default">
        <div class="flex items-center gap-2 w-full py-1 min-w-0">
          <i [class]="iconFor(node) + ' text-xs text-slate-400 dark:text-slate-500'"></i>
          <span class="font-medium text-slate-700 dark:text-slate-300 truncate">{{
            node.label
          }}</span>
          @if (node.data?.isDevice) {
            <app-status-dot
              [state]="node.data.state ?? (node.data.online ? 'online' : 'offline')"
              class="ml-auto"
            />
          }
        </div>
      </ng-template>
    </p-tree>
  </div>
</p-drawer>
